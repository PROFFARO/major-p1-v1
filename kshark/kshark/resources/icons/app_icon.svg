<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="sharkGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#007ACC" />
      <stop offset="50%" stop-color="#005A9E" />
      <stop offset="100%" stop-color="#002D5A" />
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5252" />
      <stop offset="100%" stop-color="#B71C1C" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="128" cy="128" r="120" fill="#1E1E24" stroke="#007ACC" stroke-width="6" />

  <!-- Radar Grid Circles -->
  <circle cx="128" cy="128" r="85" fill="none" stroke="#007ACC" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.4" />
  <circle cx="128" cy="128" r="50" fill="none" stroke="#007ACC" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.3" />

  <!-- Shark Fin / KShark Silhouette -->
  <path d="M 40 180 C 70 180, 110 150, 128 60 C 145 120, 185 170, 220 180 C 180 170, 150 185, 40 180 Z" 
        fill="url(#sharkGrad)" stroke="#66B2FF" stroke-width="3" />

  <!-- Security Shield Core -->
  <path d="M 128 110 L 155 125 L 155 155 C 155 175, 128 190, 128 190 C 128 190, 101 175, 101 155 L 101 125 Z" 
        fill="url(#shieldGrad)" stroke="#FFFFFF" stroke-width="2" />

  <!-- Inner eBPF Kernel Pulse Symbol -->
  <path d="M 115 150 L 123 150 L 127 138 L 131 162 L 134 146 L 137 150 L 142 150" 
        fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- KShark Text Banner -->
  <text x="128" y="222" font-family="sans-serif" font-size="20" font-weight="bold" fill="#66B2FF" text-anchor="middle" letter-spacing="3">KSHARK</text>
</svg>
